name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # Required for GitHub OIDC authentication
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  build-and-deploy:
    name: Build & Deploy React Frontend to S3 / CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 3. Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 4. TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: 5. Build React Application with Vite
        working-directory: frontend
        env:
          VITE_GRAPHQL_HTTP_URL: ${{ vars.VITE_GRAPHQL_HTTP_URL || secrets.VITE_GRAPHQL_HTTP_URL }}
          VITE_GRAPHQL_WS_URL: ${{ vars.VITE_GRAPHQL_WS_URL || secrets.VITE_GRAPHQL_WS_URL }}
        run: npm run build

      - name: 6. Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-FrontendDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: 7. Sync Build Artifacts to Amazon S3
        run: |
          echo "Deploying React build artifacts to S3 bucket: ${{ secrets.S3_BUCKET_NAME }}"
          aws s3 sync ./frontend/dist s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # Sync index.html with no-cache so users always receive latest app version immediately
          aws s3 cp ./frontend/dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: 8. Invalidate CloudFront Cache
        run: |
          echo "Invalidating CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "Created CloudFront Invalidation ID: $INVALIDATION_ID"

      - name: 9. Rollback Notice on Failure
        if: failure()
        run: |
          echo "::error::Frontend deployment failed! S3 bucket files can be reverted to previous commit release if required."
