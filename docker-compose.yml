services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Simulates Amazon RDS PostgreSQL locally)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: devops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employeedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Apollo GraphQL Server (Simulates AWS ECS Fargate container)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-graphql-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      USE_LAMBDA: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: employeedb
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # React Frontend (Simulates S3 / CloudFront hosted UI)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops-react-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_GRAPHQL_HTTP_URL=http://localhost:4000/graphql
      - VITE_GRAPHQL_WS_URL=ws://localhost:4000/graphql
    depends_on:
      - backend

volumes:
  pgdata:
